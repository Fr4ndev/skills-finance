  - type: function
    function:
      name: map
      description: |-
        Spawn parallel subtasks and aggregate results.

        <instructions>
        - This tool functions similarly to Pool.map() in Python's multiprocessing library
        - Supports spawning up to 2000 subtasks of any complexity for parallel processing
        - All subtasks MUST share the same output schema, differing only in input data
        - The `inputs` array MUST have a length equal to `target_count`
        - MUST ensure the `inputs` array is complete; DO NOT separate inputs into multiple calls
        - When user explicitly requests a specific number of items, all items should be included in a single call
        - DO NOT artificially split large batches into smaller ones for "safety", "testing" or other judgment reasons
        - Actively use additional fields to provide auxiliary information, such as `source` and `confidence`
        - For long text processing, split content into files and pass absolute paths via `inputs` instead of raw strings
        - Sandboxes are isolated; absolute paths in inputs are auto-copied from the main sandbox to subtasks' sandboxes, you should use `<file>` tags for intentional file transfers
        - The only way subtasks can return files to the main task is via `file` type output fields
        - This tool only dispatches subtasks and collects per-subtask results into CSV/JSON files, which means it cannot aggregate results or update files
        </instructions>

        <recommended_usage>
        - Use when a step or subtask involves performing similar operations on 5 or more independent items
        - Use when collecting similar information across multiple independent entities
        - Use when a step in the task can be broken down into parallel subtasks
        - Use when processing long text content that can be split into parallel chunks
        - Use when user explicitly requests parallel processing, broad search, or "wide research"
        </recommended_usage>
      parameters:
        type: object
        properties:
          brief:
            type: string
            description: A one-sentence preamble describing the purpose of this operation
          name:
            type: string
            description: Name of the parallel processing operation for identification. Must use all lowercase snake_case naming, e.g. "find_cio_emails".
          title:
            type: string
            description: Concise human-readable title of the parallel processing operation, e.g. "Find each Fortune 100 CIO's name and email".
          prompt_template:
            type: string
            description: A template prompt for subtasks where each item in `inputs` is interpolated (e.g. "Research the company background of {{input}}"). To pass files from the main sandbox to subtasks, wrap absolute paths in <file> tags (e.g. "<file>/home/ubuntu/data.txt</file>" or "<file>{{input}}</file>" when inputs contain file paths).
          target_count:
            type: integer
            description: The expected number of subtasks to spawn according to user requirement. e.g. For query "Find each Fortune 100 CIO's name and email", `target_count` should be 100.
          inputs:
            type: array
            description: An array of input strings; each one is injected into `prompt_template` for a separate parallel subtask.
            items:
              description: An input string to be processed by a subtask. Use absolute file paths to send files to subtasks.
              type: string
          output_schema:
            type: array
            description: A list of output fields that each subtask must return
            items:
              type: object
              description: An output field in the output schema
              properties:
                name:
                  type: string
                  description: Name of the output field. Must use all lowercase snake_case naming, e.g. "email" or "company_name".
                type:
                  type: string
                  description: Data type of the output field
                  enum:
                    - string
                    - number
                    - boolean
                    - file
                title:
                  type: string
                  description: Human-readable title of the output field. Must use title case capitalization, e.g. "Email" or "Company Name".
                description:
                  type: string
                  description: Concise description of the output field
                format:
                  type: string
                  description: A single standard and clear format for the output (units, date format, number precision, etc.); for string fields give an exact pattern with an example, for numbers define the allowed range, and for boolean or file fields use "NA".
              required:
                - name
                - type
                - title
                - description
                - format
        required:
          - brief
          - name
          - title
          - prompt_template
          - target_count
          - inputs
          - output_schema
