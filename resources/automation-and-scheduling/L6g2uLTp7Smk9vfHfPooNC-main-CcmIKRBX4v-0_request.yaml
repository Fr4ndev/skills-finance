        text: "Text file: SKILL.md\nLatest content with line numbers:\n1\t---\n2\tname: automation-and-scheduling\n3\tdescription: MUST read before requests involving automated execution, recurring execution, background execution, event-triggered execution, bot/agent execution, or auto-updating systems. Use it to choose the right implementation approach before building.\n4\t---\n5\t\n6\t# Automation and Scheduling\n7\t\n8\tRead this before building any automation, scheduled task, recurring workflow, bot, monitoring, or \"if X then Y\" system. Do not start building until you complete the assessment below.\n9\t\n10\t\n11\t## Step 1: Assess the Request\n12\t\n13\tAnswer these questions before choosing an architecture. You can often infer from context — ask the user only when you cannot infer and the answer would change the route.\n14\t\n15\t### 1. Is the user asking to \"build\" something, or to \"do\" something?\n16\t\n17\t\"Build me a tracker / monitor / tool / system\" implies a durable product with long-term ownership. The user likely expects a management interface, room to grow, and ongoing control. \"Check X every day and tell me\" is a task to run — simpler setup is fine.\n18\t\n19\t### 2. Does the execution need AI judgment, or is it deterministic code?\n20\t\n21\t\"Summarize new documents\" needs judgment. \"Check if price > threshold and notify\" is a programmatic step — an API call, a comparison, and a notification. Many requests sound intelligent but are actually deterministic. **Deterministic tasks should NOT use Manus execution** — Manus takes minutes to start, costs credits per run, and adds no value when the logic is a few lines of code.\n22\t\n23\t### 3. Will the scope or frequency grow?\n24\t\n25\t\"Just one item for now\" or \"start with X only\" implies more later. Growing scope × frequency means Manus credits scale linearly, while programmatic execution is essentially free per run.\n26\t\n27\t### 4. Does the user need to manage parameters over time?\n28\t\n29\tAdd/remove items, adjust thresholds, change recipients — this needs a GUI, which points to WebDev. If it's truly set-and-forget, a schedule is fine.\n30\t\n31\t### 5. Where does the data come from?\n32\t\n33\tPublic API → programmatic code can call it directly. Manus connector → needs Manus execution or Manus API. When both are possible, present the tradeoff.\n34\t\n35\t### 6. What triggers it?\n36\t\n37\tFixed time → schedule or WebDev cron. External event (webhook, new message) → persistent trigger. Must stay online 24/7 → persistent computing.\n38\t\n39\t## Step 2: Choose the Route\n40\t\n41\tMap your assessment answers to a route. **If multiple routes are viable, present 2–3 options with concrete tradeoffs and let the user choose. Do not pick for them.**\n42\t\n43\t**Tool mapping**: `manus-config schedule` creates Manus-executed scheduled tasks — only use it when the assessment points to Manus execution. When the assessment points to WebDev + cron, use `webdev_init_project` to create a web app with backend cron jobs — this is the right tool even when the user does not say \"website.\" Do not default to scheduled tasks just because the user mentions a time interval, and do not choose Manus execution just because a Manus connector is available — connector convenience does not justify ongoing per-run credit costs for tasks that are deterministic. A one-time webhook or API key setup is a small upfront cost compared to credits consumed on every run indefinitely.\n44\t\n45\t| Assessment points to… | Route |\n46\t| --- | --- |\n47\t| Judgment-heavy execution, complex output (reports, summaries, analysis), quality matters most | **schedule → Manus execution** — Use `manus-config schedule`. Manus runs the task at fixed times. No code to write, uses Manus connectors. Costs credits per run. No management UI. |\n48\t| Deterministic execution, simple output (notifications, data writes), scope may grow, user may need to manage parameters, cost or latency matters | **WebDev + cron** — Use `webdev_init_project`. A WebDev app with backend cron jobs running deterministic code. Free per run. Can include a GUI for managing parameters. Stateless, 15-min timeout, 1 vCPU / 512 MB. **WebDev cannot use Manus connectors directly** — external integrations (Slack, Telegram, email, etc.) require the user to set up their own API keys or webhook URLs. This one-time setup cost is far lower than per-run Manus credits. Read `persistent-computing` for full WebDev capabilities. |\n49\t| Event-triggered or complex trigger logic (webhooks, polling with state, filtering, dedup) | **Persistent Trigger + Manus API** — A durable host detects events, then creates Manus tasks for execution. Read `persistent-computing` and `manus-api`. |\n50\t| Standard web app, dashboard, or CRUD tool | **WebDev** — Use `webdev_init_project`. Read `persistent-computing` for capabilities. |\n51\t| Always-on service, Docker, fixed IP, webhook endpoint | **Persistent computing** — Read `persistent-computing` before recommending. |\n52\t| One-off or current-session work | **default sandbox** |\n53\t\n54\t## Step 3: Clarify if Needed\n55\t\n56\tAsk only the 2–4 questions that would change the architecture. **Architecture questions come before implementation questions** — \"which Slack channel?\" or \"alert above or below?\" are implementation details that come after the route is decided.\n57\t\n58\t| When you can't infer… | Ask |\n59\t| --- | --- |\n60\t| Execution nature | \"Is this a rule-based check, or does it need analysis/writing/judgment?\" |\n61\t| Scale trajectory | \"Will the scope stay as-is, or might you add more items / increase frequency?\" |\n62\t| Manageability | \"Do you want to adjust parameters over time, or set it once and let it run?\" |\n63\t| Data source | \"Should this use a Manus connector, or is the data available via a public API?\" |\n64\t| Cost vs. convenience | \"Would you prefer a quick setup that costs credits per run, or invest setup time for a free-running solution?\" |\n65\t\n66\t## Anti-Patterns\n67\t\n68\t| Don't | Do instead |\n69\t| --- | --- |\n70\t| Use Manus execution for deterministic, rule-based tasks. | Use programmatic execution — it's faster, cheaper, and scales. |\n71\t| Skip the assessment and route from surface pattern alone. | Always assess. \"Simple fixed-time task\" often has hidden dimensions that change the route. |\n72\t| Ask implementation questions before settling architecture. | Architecture first, then implementation details. |\n73\t| Pick one route silently when multiple are viable. | Present options with tradeoffs. Let the user choose. |\n74\t| Ignore \"build / tool / system\" language signals. | These imply durability, manageability, and growth — not a one-off task. |\n75\t| Automatically send, post, or modify external data without approval. | Add confirmation or an explicit approval step. |\n76\t\n77\t## Related Skills\n78\t\n79\t| When | Read |\n80\t| --- | --- |\n81\t| Route involves WebDev or persistent hosting | `persistent-computing` |\n82\t| Route involves Manus API | `manus-api` |\n83\t\n84\tRead `references/implementation-patterns.md` after a route is selected for concrete playbooks.\n85\t"
